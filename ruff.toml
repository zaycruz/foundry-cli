# Ruff configuration — Raava CI quality gates, TIER 1 only.
# Template: engineering/standards/templates/ci-gates/python/ruff.toml
# Standard: engineering/standards/ci-quality-gates-standard.md (ADR-0003)
#
# Every rule selected here is an error: `ruff check` (the `lint` job) fails on
# any of them, so the tree must be green on day one.
#
# TIER 2 (complexity, size, arguments, nesting, Any, pytest style,
# assertion-free tests) is NOT configured here. scripts/ci/lint_ratchet.py
# runs it with `ruff --isolated` and its own thresholds, so nothing in this file
# can loosen Tier 2. A ruff.toml takes precedence over [tool.ruff] in
# pyproject.toml: move any existing [tool.ruff] settings here at adoption.
#
# CODEOWNERS-protected.

# REPO-SPECIFIC: the oldest Python the package supports.
target-version = "py310"  # requires-python >= 3.10

# REPO-SPECIFIC: generated files only (e.g. "*_pb2.py"). Never a source directory.
extend-exclude = ["mutants"]

# foundry-cli keeps `ruff format --check` in the `lint` job (it was in the old
# lint-and-format job). The gate scripts are verbatim template copies with their
# own line style, so the formatter skips them; the linter does not.
[format]
exclude = ["scripts/ci/**"]

[lint]
select = [
  "E4", "E7", "E9", "F",  # ruff defaults: syntax, imports, undefined names, redefined tests (F811)
  "PGH004",               # a bare `# noqa` silences everything; name the rule
  "RUF100",               # a `# noqa` that suppresses nothing is stale
  "T10",                  # no debugger breakpoints
]
