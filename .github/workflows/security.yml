name: security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: secret and environment-data scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Pull requests need the base commit to diff against; a shallow
          # checkout leaves nothing to compare and the range scan silently
          # covers nothing.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          version=8.30.1
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # What the branch would ship. This is the gate that matters: anything
      # present in the tree is what a reader gets by cloning.
      - name: Scan the working tree
        run: gitleaks dir --no-banner --redact --verbose --config .gitleaks.toml .

      # A violation added and then removed inside the same pull request is
      # absent from the tree but permanent in history, so the tree scan alone
      # would wave it through. Range-scan the pull request's own commits.
      #
      # Deliberately NOT scanning full history. Commits predating this workflow
      # carry dated verification notes and probe-file references that the rules
      # below would flag. Removing them means rewriting history, and a rewrite
      # on a public repository publishes the pre-rewrite SHA in the push event
      # while leaving the object fetchable -- it advertises what it is hiding.
      # The accepted position is: freeze the past, gate everything new.
      - name: Scan commits introduced by this pull request
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          gitleaks git --no-banner --redact --verbose \
            --config .gitleaks.toml \
            --log-opts="${BASE}..${HEAD}" .
