[project]
name = "foundry-cli"
version = "0.33.0"
description = "Agent-native command-line interface for Palantir Foundry APIs"
authors = [
    { name = "Anjor Kanekar" },
    { name = "Zay Cruz" },
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.3.3,<8.4.0",
    "click-repl>=0.3.0",
    "defusedxml>=0.7.1",
    "foundry-platform-sdk>=1.95.0,<2.0.0",
    "keyring>=25.6.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
    "rich>=14.1.0",
    "typer>=0.18.0,<0.19.0",
]
keywords = [
    "palantir",
    "foundry",
    "cli",
    "api",
    "data",
    "ontology",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/zaycruz/foundry-cli"
Repository = "https://github.com/zaycruz/foundry-cli"
Issues = "https://github.com/zaycruz/foundry-cli/issues"
Changelog = "https://github.com/zaycruz/foundry-cli/blob/main/CHANGELOG.md"
Documentation = "https://github.com/zaycruz/foundry-cli/blob/main/README.md"

[project.scripts]
pfoundry = "foundry_cli.cli:main_entrypoint"

[project.optional-dependencies]
langfuse = [
    "langfuse>=4.0.0,<5.0.0",
]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/foundry_cli",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/foundry_cli",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]
exclude = [
    "/.omo",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/CONCEPTS.md",
    "/IDEA.md",
    "/docs",
    "/integrations",
    "/tests",
    "/tickets",
]

[dependency-groups]
# Gate tools are exact pins (Raava CI quality gates, ADR-0003): the gates'
# behaviour is the tool's behaviour. pyproject.toml is CODEOWNERS-protected.
dev = [
    "bandit>=1.8.6",
    "complexipy==8.0.1",
    "deptry==0.25.1",
    "mutmut==3.7.0",
    "mypy==2.3.1",
    "pip-audit==2.10.1",
    "pre-commit>=4.3.0",
    "pydocstyle>=6.3.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "regexploit==1.0.0",
    "ruff==0.16.8",
    "tomli-w>=1.2.0",
    "types-defusedxml>=0.7.0.20260504",
    "types-requests>=2.32.4.20250611",
    "vulture==2.16",
]

# --- Raava CI quality gates (engineering/standards/templates/ci-gates/python) ---

[tool.pytest.ini_options]
# Keep pytest out of mutmut's working copy. pytest's defaults plus "mutants".
norecursedirs = [".*", "*.egg", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "mutants"]

[tool.coverage.run]
# `source` (not `include`): files no test imports report as 0%, so diff-cover sees them.
source = ["src/foundry_cli"]
branch = true

[tool.vulture]
# Package and tests: code used only by tests counts as used.
paths = ["src", "tests"]
min_confidence = 60
# Framework hooks vulture cannot see being called. Add a decorator here, in its
# own reviewed PR, before relying on it.
ignore_decorators = ["@pytest.fixture", "@*.command", "@*.callback", "@*.route", "@*.get", "@*.post"]
ignore_names = ["test_*", "Test*", "setUp*", "tearDown*", "pytest_*"]
exclude = ["mutants/", ".venv/"]

[tool.deptry]
known_first_party = ["foundry_cli"]
extend_exclude = ["mutants", "scripts/ci"]

[tool.mutmut]
# scripts/ci/mutation.py sets source_paths per run; do NOT set it here.
# also_copy: everything the tests import or read besides the mutated files.
pytest_add_cli_args_test_selection = ["tests/"]
also_copy = ["src/", "scripts/", "skills/", "llms.txt", "README.md"]
